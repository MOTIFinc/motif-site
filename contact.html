<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="MOTIFへのお問い合わせ。依頼が固まっていなくても、大丈夫です。">
  <link rel="canonical" href="https://motif-tokyo.com/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MOTIF">
  <meta property="og:title" content="Contact｜MOTIF">
  <meta property="og:description" content="MOTIFへのお問い合わせ。依頼が固まっていなくても、大丈夫です。">
  <meta property="og:url" content="https://motif-tokyo.com/contact.html">
  <meta property="og:image" content="https://motif-tokyo.com/assets/img/og.jpg?v=17274eb1">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=823306f8">
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="./" class="logo-block">
      <img class="logo-img" src="assets/img/logo-motif.png?v=5520a973" alt="MOTIF" width="401" height="96">
      <span class="place">Paris / Tokyo</span>
    </a>
    <nav class="nav">
      <a href="./#story">STORY</a>
      <a href="./#works">WORKS</a>
      <a href="./#services">SERVICES</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="メニューを開く"><span></span><span></span></button>
  </div>
</header>

<div class="menu" id="site-menu" hidden>
  <nav class="menu-nav">
    <a class="r-h" href="./#story">STORY</a>
    <a class="r-h" href="./#works">WORKS</a>
    <a class="r-h" href="./#services">SERVICES</a>
    <a class="r-h" href="contact.html">CONTACT</a>
  </nav>
</div>

<main>
  <section class="wrap two-col contact-page">
    <div class="col-left">
      <p class="r-note">CONTACT</p>
      <h1 class="r-h">LET’S FIND YOUR MOTIF.</h1>
      <p class="r-body intro">依頼が<wbr>固まっていなくても、<wbr>大丈夫です。<br>振り向かれる<wbr>理由は、<wbr>もう、<wbr>そこにあります。</p>
    </div>

    <div class="col-right">
      <form id="contact-form" class="form" novalidate>
        <div class="field">
          <label class="r-note" for="f-name">お名前<span class="req">必須</span></label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label class="r-note" for="f-company">会社名</label>
          <input id="f-company" name="company" type="text" autocomplete="organization">
        </div>
        <div class="field">
          <label class="r-note" for="f-email">メールアドレス<span class="req">必須</span></label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="r-note" for="f-message">ご相談内容<span class="req">必須</span></label>
          <textarea id="f-message" name="message" rows="8" required></textarea>
        </div>
        <p class="r-note form-error" id="form-error" hidden>必須の<wbr>項目を<wbr>入力してください。</p>
        <button class="btn" type="submit">send</button>
      </form>
      <p class="r-note mail">メールでも<wbr>受け付けています。 <a class="js-mail" data-u="contact" data-d="motif-tokyo.com">contact [at] motif-tokyo.com</a></p>

      <div class="form-done" id="form-done" hidden>
        <p class="r-sub">ありがとうございます。</p>
        <p class="r-body">メッセージを<wbr>受け取りました。<wbr>内容を<wbr>確認して、<wbr>ご連絡します。</p>
        <a class="r-note back" href="./">← MOTIF トップへ</a>
      </div>
    </div>
  </section>
</main>

<footer class="wrap site-footer">
  <a class="to-top" href="#" aria-label="ページの先頭へ戻る"><img class="logo-img footer-logo" src="assets/img/logo-motif.png?v=5520a973" alt="MOTIF" width="401" height="96" loading="lazy"></a>
</footer>

<script src="assets/js/contact.js?v=03c7007a"></script>
<script src="assets/js/main.js?v=e1274362"></script>
</body>
</html>
